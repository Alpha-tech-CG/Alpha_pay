# AlphaPay V1 — environnement local complet, en une commande :
#
#   docker compose up --build
#
# Lance Postgres, Redis, MailHog, les migrations, l'API, le worker (file de
# tâches), le tableau de bord marchand et le back-office. Tous les fournisseurs
# externes sont FACTICES par défaut (opérateurs, KYC, messages, carte) : aucun
# compte externe n'est nécessaire (§2.7).
#
#   API          http://localhost:3000   (/health, /ready, /docs)
#   Tableau de bord  http://localhost:5174
#   Back-office  http://localhost:5180
#   MailHog      http://localhost:8025   (emails capturés)
#
# Les valeurs ci-dessous sont des valeurs de DÉVELOPPEMENT, publiques par
# construction : ne jamais les réutiliser ailleurs. La pile d'observabilité
# (Prometheus, Grafana, Loki, Tempo) est séparée : infra/docker-compose.observability.yml.
name: alphapay-local

x-api-env: &api-env
  NODE_ENV: development
  PORT: "3000"
  DATABASE_URL: postgresql://alphapay:alphapay@postgres:5432/alphapay
  REDIS_URL: redis://redis:6379
  PUBLIC_API_URL: http://localhost:3000
  CHECKOUT_URL: http://localhost:3000
  ALLOWED_ORIGINS: http://localhost:5174,http://localhost:5180
  MOBILE_MONEY_TEST_PROVIDER: mock
  MTN_SANDBOX_CURRENCY: EUR
  FEATURE_CARD_PAYMENTS: "false"
  # Clés de développement (base64, 32 octets) — jamais en préproduction ni en production.
  PII_ENCRYPTION_KEY: ZGV2LW9ubHktcGlpLWtleS0wMDAwMDAwMDAwMDAwMDA=
  PROVIDER_CREDENTIALS_KEY: ZGV2LW9ubHktcHJvdmlkZXItY3JlZHMtMDAwMDAwMDA=
  DOCUMENTS_ENCRYPTION_KEY: ZGV2LW9ubHktZG9jdW1lbnRzLWtleS0wMDAwMDAwMDA=
  STORAGE_DIR: /data/storage
  API_KEY_PEPPER: dev-only-pepper-not-for-production-0000000000
  INTERNAL_API_TOKEN: dev-only-internal-token-0000000000000000
  JWT_SECRET: dev-only-jwt-secret-not-for-production-000000
  OTP_HMAC_SECRET: dev-only-otp-secret-not-for-production-0000
  CALLBACK_SIGNING_SECRET: dev-only-callback-secret-not-for-production-00
  MESSAGING_WEBHOOK_TOKEN: dev-only-messaging-webhook-token-00000000
  # Emails réels capturés par MailHog ; SMS et WhatsApp factices (GET /dev/outbox).
  EMAIL_PROVIDER: smtp
  SMTP_URL: smtp://mailhog:1025
  EMAIL_FROM: AlphaPay <no-reply@alphapay.local>
  LOG_LEVEL: info

x-api-image: &api-image
  image: alphapay-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: alphapay
      POSTGRES_PASSWORD: alphapay
      POSTGRES_DB: alphapay
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphapay -d alphapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"

  # Migrations versionnées, appliquées avant le démarrage de l'API et du worker.
  migrate:
    <<: *api-image
    command: ["node", "dist/scripts/migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment: *api-env
    # Pièces KYB chiffrées : volume persistant (STORAGE_DIR).
    volumes:
      - api_storage:/data/storage
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ready || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Même image que l'API, sans serveur HTTP : consomme la file de tâches (D-008).
  worker:
    <<: *api-image
    command: ["node", "dist/worker"]
    environment:
      <<: *api-env
      SERVICE_NAME: alphapay-worker
    # L'image embarque le healthcheck HTTP de l'API ; le worker n'écoute aucun
    # port : on vérifie simplement que son process tourne.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node dist/worker' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Fronts en mode développement (Vite) : le proxy injecte côté serveur la clé
  # API marchand ou le jeton interne, jamais exposés au navigateur. L'accès
  # par compte (mot de passe + OTP) remplace ce mécanisme avec T-30.
  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5174"]
    environment:
      API_PROXY_TARGET: http://api:3000
      MERCHANT_API_KEY: ${MERCHANT_API_KEY:-}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - api

  admin:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5180"]
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "5180:5180"
    depends_on:
      - api

volumes:
  api_storage:
  postgres_data:
  redis_data:
  dashboard_node_modules:
  admin_node_modules:
