packages:
  - 'apps/*'
  - 'packages/*'

# --- Réglages pnpm ---
# IMPORTANT : pnpm 11 lit ces réglages ICI (clés camelCase), PAS dans .npmrc
# (qui est ignoré pour ces clés). C'est pourquoi il n'y a plus de .npmrc.

# Arborescence plate façon npm : évite les cassures liées aux symlinks pnpm
# (modules natifs argon2, assemblage de l'image Docker, deps « fantômes »).
nodeLinker: hoisted

# Compatibilité : tolérant sur les peer deps comme npm ; lier les paquets internes
# du monorepo depuis le workspace, pas le registry.
strictPeerDependencies: false
autoInstallPeers: true
linkWorkspacePackages: true

# Quarantaine supply-chain : refuse d'installer une version publiée depuis moins
# de 3 jours (4320 min). N'affecte que la RÉSOLUTION de nouvelles versions ; les
# versions déjà verrouillées (pnpm-lock.yaml) ne sont pas bloquées.
minimumReleaseAge: 4320

# Sécurité : contrôle explicite des scripts d'install (postinstall/build). Tout
# paquet non listé à `true` est bloqué par défaut.
#   true  → argon2 (natif, hachage PIN/mdp), prisma/@prisma/* (client + moteurs),
#           sharp (images Next.js, binaires fiables)
#   false → @scarf/scarf (tracking), core-js (financement),
#           msgpackr-extract & protobufjs (accélérateurs natifs optionnels,
#           repli JS automatique) — aucun impact fonctionnel.
allowBuilds:
  argon2: true
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  sharp: true
  '@scarf/scarf': false
  core-js: false
  msgpackr-extract: false
  protobufjs: false

# Correctifs de sécurité des dépendances indirectes (pnpm audit, T-105) : même
# version majeure, montée au correctif publié. Les montées majeures (nodemailer,
# OpenTelemetry, Prisma) sont suivies à part (docs/PROGRESS.md).
overrides:
  proxy-addr: ^2.0.8
  body-parser@2: ^2.4.0
  multer@2: ^2.5.0
  js-yaml@4: ^4.3.2
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  nanoid@5: ^5.1.16
  zod@4: ^4.6.6
