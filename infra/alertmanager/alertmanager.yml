# Alertmanager AlphaPay — livraison des alertes définies dans
# prometheus/alerts/paybrain-alerts.yml (float drift, brute-force PIN, API down,
# webhooks HMAC…). Sans ce composant, les alertes se déclenchent dans Prometheus
# mais ne préviennent personne (AVANT_PROD §0.6).
#
# ⚠️ À FAIRE : remplacer l'URL Slack ci-dessous par un vrai Incoming Webhook
# (https://api.slack.com/messaging/webhooks). En prod, injecter via un secret
# monté, ne pas committer l'URL réelle. Pour de l'email à la place de Slack,
# remplacer le receiver par un bloc `email_configs` (SMTP Postmark, cf. §D).
global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/REPLACE/WITH/YOUR/WEBHOOK'

route:
  receiver: paybrain-slack
  group_by: ['alertname', 'area']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Les alertes critiques (float drift, API down) sont répétées plus souvent.
    - matchers:
        - severity="critical"
      receiver: paybrain-slack
      repeat_interval: 1h

receivers:
  - name: paybrain-slack
    slack_configs:
      - channel: '#paybrain-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.severity }} · {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Labels.area }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
