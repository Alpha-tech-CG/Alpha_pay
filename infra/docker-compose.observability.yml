# Stack d'observabilité AlphaPay — Prometheus (métriques) + Loki/Promtail (logs)
# + Tempo (traces) + Grafana (dashboards). Utilise les configs déjà présentes
# dans ce dossier. Lancement :  docker compose -f docker-compose.observability.yml up -d
# Grafana : http://localhost:3001  (admin / admin au 1er login)
# L'API est scrapée sur host.docker.internal:3000 (voir prometheus/prometheus.yml).
version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on: [alertmanager]
    restart: unless-stopped

  # Livraison des alertes (Slack/email) — cf. alertmanager/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - '9093:9093'
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    command: ['-config.file=/etc/tempo/config.yml']
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'   # tempo query
      - '4317:4317'   # OTLP gRPC (traces depuis l'API)
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
